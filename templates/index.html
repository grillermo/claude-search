<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude history search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="flex h-screen flex-col">
      <header class="border-b border-slate-800 bg-slate-900 px-4 py-4 sm:px-6">
        <form id="search-form" class="mx-auto flex max-w-5xl flex-wrap items-end gap-3">
          <label class="min-w-0 flex-1 text-sm font-medium text-slate-200" for="search-term">
            Search Claude history
            <input
              id="search-term"
              name="term"
              type="search"
              class="mt-1 block w-full rounded-md border border-slate-600 bg-slate-950 px-3 py-2 text-base text-slate-100 shadow-sm outline-none placeholder:text-slate-500 focus:border-sky-400 focus:ring-2 focus:ring-sky-400"
              placeholder="Search with a regular expression"
              aria-describedby="regex-hint"
            >
          </label>
          <label class="min-w-0 flex-1 text-sm font-medium text-slate-200" for="project-path">
            Project path
            <input
              id="project-path"
              name="path"
              type="text"
              class="mt-1 block w-full rounded-md border border-slate-600 bg-slate-950 px-3 py-2 text-base text-slate-100 shadow-sm outline-none placeholder:text-slate-500 focus:border-sky-400 focus:ring-2 focus:ring-sky-400"
              placeholder="Filter by project path (optional)"
            >
          </label>
          <label class="flex items-center gap-2 pb-2 text-sm text-slate-300" for="case-sensitive">
            <input id="case-sensitive" name="case_sensitive" type="checkbox" class="h-4 w-4 rounded border-slate-500 bg-slate-950 text-sky-500 focus:ring-sky-400">
            Case sensitive
          </label>
          <label class="flex items-center gap-2 pb-2 text-sm text-slate-300" for="include-assistant">
            <input id="include-assistant" name="include_assistant" type="checkbox" class="h-4 w-4 rounded border-slate-500 bg-slate-950 text-sky-500 focus:ring-sky-400">
            Search all conversation
          </label>
          <button type="submit" class="rounded-md bg-sky-500 px-4 py-2 font-medium text-slate-950 hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-300">
            Search
          </button>
          <p id="regex-hint" class="w-full text-sm text-slate-400">Regular expressions are supported.</p>
        </form>
      </header>

      <main id="result-viewport" class="min-h-0 flex-1 overflow-y-auto px-4 py-6 sm:px-6" aria-live="polite">
        <div class="mx-auto flex min-h-full max-w-5xl flex-col">
          <p id="result-status" class="mb-6 text-slate-400">Search your Claude history</p>
          <article id="result-content" class="hidden min-w-0 space-y-5 pb-6">
            <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-slate-400">
              <time id="result-relative-date"></time>
              <p id="result-project-path" class="break-all"></p>
            </div>
            <h1 id="result-title" class="whitespace-pre-wrap break-words text-2xl font-semibold text-white"></h1>
            <section id="matching-message-container" class="space-y-2">
              <h2 class="text-sm font-medium uppercase tracking-wide text-slate-400">Matching message</h2>
              <p id="matching-message" class="whitespace-pre-wrap break-words text-slate-200"></p>
            </section>
          </article>

          <div id="resume-command" class="sticky bottom-0 mt-auto hidden border-t border-slate-700 bg-slate-950/95 py-4 backdrop-blur">
            <div class="flex flex-wrap items-center gap-3 rounded-md bg-slate-900 p-3">
              <code id="resume-command-text" class="min-w-0 flex-1 select-text whitespace-pre-wrap break-all text-sm text-sky-200"></code>
              <button id="copy-command" type="button" class="rounded-md border border-slate-600 px-3 py-1.5 text-sm font-medium text-slate-100 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400">
                Copy
              </button>
            </div>
          </div>
        </div>
      </main>

      <nav id="result-navigation" class="hidden border-t border-slate-800 bg-slate-900 px-4 py-3 sm:px-6" aria-label="Search results">
        <div class="mx-auto flex max-w-5xl items-center justify-between gap-4">
          <button id="previous-result" type="button" class="rounded-md border border-slate-600 px-3 py-1.5 text-sm font-medium text-slate-100 enabled:hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-sky-400">
            Previous
          </button>
          <p id="result-position" class="text-sm text-slate-300"></p>
          <button id="next-result" type="button" class="rounded-md border border-slate-600 px-3 py-1.5 text-sm font-medium text-slate-100 enabled:hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-sky-400">
            Next
          </button>
        </div>
      </nav>
    </div>
  </body>
</html>
